name: Fresh Vinai build

on:
  push:
    branches:
      - fresh-vinai-foundation
  pull_request:
    branches:
      - fresh-vinai-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: vinai-web-dist
          path: dist/
          if-no-files-found: error
