name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL }}
      - name: Generate Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync native plugins
        run: npx cap sync android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vinai-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to latest GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "Skipping release publication because this APK build is stale."
            exit 0
          fi
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest "$APK" \
              --title "வினை (Vinai) — Android Mobile App" \
              --notes "வினை (Vinai) Android APK. Built from the latest main branch."
          else
            gh release upload latest "$APK" --clobber
            gh release edit latest \
              --title "வினை (Vinai) — Android Mobile App" \
              --notes "வினை (Vinai) Android APK. Built from the latest main branch." \
              --latest
          fi

