name: Build VINAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-build
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "android/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://uwvizniuhecczokwwgur.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_xyOp4XJGGOZoouomoo29lQ_HNOSeayy' }}

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK package, signature, alignment, and permissions
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "name='com.todo.foradhd' versionCode='2' versionName='1.1'" /tmp/badging.txt
          "$BUILD_TOOLS/aapt" dump permissions "$APK" > /tmp/permissions.txt
          if grep -q "android.permission.CAMERA" /tmp/permissions.txt; then
            cat /tmp/permissions.txt
            echo "Unexpected camera permission found in APK"
            exit 1
          fi
          cat /tmp/apksigner.txt
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.todo.foradhd 1

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: vinai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
